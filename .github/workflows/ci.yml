name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies (Root)
        run: npm install

      - name: Validate Backend
        run: |
          cd backend
          npm install
          npx tsc --noEmit

      - name: Validate Frontend
        run: |
          cd frontend
          npm install
          npx tsc --noEmit

      - name: Start Test Infrastructure
        run: docker compose up -d db

      - name: Verify Database Integrity
        run: |
          echo "Iniciando secuencia de verificación del nodo de datos..."
          for i in {1..10}; do
            if docker exec security-edge-db pg_isready -U postgres; then
              echo "¡Conexión establecida! Nodo de datos sincronizado."
              exit 0
            fi
            echo "Esperando sincronización del nodo... ($i/10)"
            sleep 5
          done
          echo "ERROR: El nodo de datos no respondió en el tiempo esperado."
          exit 1
