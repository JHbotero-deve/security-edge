name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias (Root)
        run: npm install

      - name: Validar Backend
        run: |
          cd backend
          npm install
          npx tsc --noEmit

      - name: Validar Frontend
        run: |
          cd frontend
          npm install
          npx tsc --noEmit

      - name: Levantar Infraestructura de Prueba
        run: docker compose up -d database

      - name: Verificar Integridad de Base de Datos
        run: |
          echo "Iniciando secuencia de verificación del nodo de datos..."
          for i in {1..10}; do
            if docker exec security-edge-db pg_isready -U postgres; then
              echo "¡Conexión establecida! Nodo de datos sincronizado."
              exit 0
            fi
            echo "Esperando sincronización del nodo... ($i/10)"
            sleep 5
          done
          echo "ERROR: El nodo de datos no respondió en el tiempo esperado."
          exit 1
