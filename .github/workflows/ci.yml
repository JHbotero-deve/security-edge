name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install

      - name: Auditoría Técnica (Type Checking)
        run: |
          echo "Verificando integridad de tipos en el Backend..."
          cd backend && npx tsc --noEmit
          echo "Verificando integridad de tipos en el Frontend..."
          cd ../frontend && npx tsc --noEmit

      - name: Validación de Construcción (Build)
        run: |
          cd frontend
          npm run build
          echo "Construcción final exitosa. Sistema listo para despliegue."
