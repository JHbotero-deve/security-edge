services:
  database:
    image: postgres:16
    container_name: security-edge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: security_edge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - security-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-edge-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/security_edge?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_me}
      PORT: 3000
      ENABLE_HEALTH_CHECK: "true"
    ports:
      - "3000:3000"
    depends_on:
      - database
    networks:
      - security-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-edge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - security-network

networks:
  security-network:
    driver: bridge

volumes:
  postgres_data:
