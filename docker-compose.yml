services:
  database:
    image: postgres:16
    container_name: security-edge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: security_edge
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - security-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-edge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/security_edge?schema=public
    ports:
      - "3000:3000"
    depends_on:
      - database
    networks:
      - security-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-edge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - security-network

networks:
  security-network:
    driver: bridge

volumes:
  postgres_data:
